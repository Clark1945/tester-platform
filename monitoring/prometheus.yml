global:
  scrape_interval: 5s       # 預設是 15s；本專案的故障測試只有幾十秒，抓密一點圖才看得出變化
  evaluation_interval: 5s   # 多久評估一次告警規則

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  - job_name: receiver
    static_configs:
      - targets: ["receiver:8080"]

  # RabbitMQ 內建 Prometheus 外掛（port 15692）。預設的 /metrics 只有整台 broker 的總和，
  # 要每個 queue 各自的深度得用 /metrics/detailed 並指定要哪些指標族。
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics", "queue_consumer_count"]
    static_configs:
      - targets: ["rabbitmq:15692"]
